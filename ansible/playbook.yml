- name: Setup and Deploy Flask App
  hosts: all
  become: yes

  vars:
    jenkins_user: jenkins
    jenkins_home: /home/jenkins

  tasks:
   
    - name: Install required system packages
      yum:
        name:
          - git
          - docker
          - python3
          - conntrack
          - curl
          - tar
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.6.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Clone GitHub repo
      git:
        repo: https://github.com/AdeleyeAdeyemi/e-commerce.git
        dest: /home/ec2-user/e-commerce
        
    - name: Run Docker Compose
      become: no
      shell: /usr/local/bin/docker-compose up -d
      args:
        chdir: /home/ec2-user/e-commerce 

    - name: Get latest kubectl version
      become: no
      shell: curl -L -s https://dl.k8s.io/release/stable.txt
      register: kubectl_version
      changed_when: false
      environment:
        HOME: /home/ec2-user/e-commerce 

    - name: Download kubectl
      become: no
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /home/ec2-user/e-commerce/bin/kubectl
        mode: '0755'
      environment:
        HOME: /home/ec2-user/e-commerce  

    - name: Install Minikube
      become: no
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /home/ec2-user/e-commerce /bin/minikube
        mode: '0755'
      environment:
        HOME: /home/ec2-user/e-commerce  
    - name: Start Minikube as Jenkins user
      become: no
      shell: |
        /home/ec2-user/e-commerce/bin/minikube start --driver=docker --kubernetes-version=stable \
        --apiserver-ips={{ ansible_host }} \
        --apiserver-name={{ ansible_host }}"
      args:
        executable: /bin/bash
      environment:
        HOME: /home/ec2-user/e-commerce 
        PATH: /home/ec2-user/e-commerce /bin:{{ ansible_env.PATH }}











